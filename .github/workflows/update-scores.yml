
name: Update NFL results

on:
  schedule:
    - cron: '21 6 * * *'
    - cron: '21 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update NFL scores
        run: |
          mkdir -p scripts data
          cp sync_scores.py scripts/sync_scores.py
          if [ ! -f data/results.json ]; then
            cp results.json data/results.json
          fi
          python scripts/sync_scores.py

      - name: Save updated scores
        run: |
          git config user.name "nfl-scores-bot"
          git config user.email "nfl-scores-bot@users.noreply.github.com"
          git add data/results.json data/results.js
          if ! git diff --cached --quiet; then
            git commit -m "Update NFL results"
            git push
          fi
